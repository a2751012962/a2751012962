<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',Arial,sans-serif;fill:#f5f5f7}.mute{fill:#a1a1a6}.accent{fill:#2997ff}.eyebrow{font-size:13px;font-weight:600;fill:#a1a1a6}.big{font-weight:700;letter-spacing:-.022em}.num{font-variant-numeric:tabular-nums}@keyframes appear{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(8px)}}@media (prefers-reduced-motion:no-preference){.r{animation:rise .6s ease-out both}}</style>
