<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',Arial,sans-serif;fill:#f5f5f7}.mute{fill:#a1a1a6}.accent{fill:#2997ff}.eyebrow{font-size:13px;font-weight:600;fill:#a1a1a6}.big{font-weight:700;letter-spacing:-.022em}.num{font-variant-numeric:tabular-nums}@keyframes appear{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(8px)}}.grow{transform-box:fill-box;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}@media (prefers-reduced-motion:no-preference){.grow{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}.r{animation:rise .6s ease-out both}}</style>
