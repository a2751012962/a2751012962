<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 214" width="460" height="214" role="img" aria-label="Languages across public repositories: HTML 39.1%, JavaScript 28.8%, TypeScript 21.8%, Python 5.5%, CSS 2.7%, PLpgSQL 1.9%, Vue 0.1%, Other 0.1%">
